<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Cold — Autonomous Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: hsl(220, 30%, 4%);
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body data-nav-id="w025">

<canvas id="field" role="img" aria-label="Cold"></canvas>
<p class="sr-only" id="reading"></p>

<script>
(function() {
  'use strict';

  // ============================================================
  // COLD
  //
  // Reference realization of the specification.
  //
  // A TCP connection, simulated. Starts from cwnd = 1 every visit.
  // Slow-start until ssthresh; then congestion-avoidance (AIMD).
  // Loss halves the window. Idle timeout restarts from cold.
  //
  // See SPECIFICATION.md in this directory. All algorithmic
  // decisions are from Jacobson & Karels, SIGCOMM 1988.
  // ============================================================

  // === PARAMETERS (per spec) ===
  const RTT_MS = 900;
  const SSTHRESH_INIT = 32;
  const LOSS_P_SLOWSTART = 0.03;   // per-packet, elevated during discovery
  const LOSS_P_AVOIDANCE = 0.02;   // per-packet in steady state
  const IDLE_RESET_MS = 6000;      // idle timer per Appendix C

  // === STATE ===
  const startTime = Date.now();
  let cwnd = 1;
  let ssthresh = SSTHRESH_INIT;
  let mode = 'slowstart';          // 'slowstart' | 'avoidance'
  let lastTickTime = startTime;

  const marks = [];   // { t, y } — acked packets
  const losses = [];  // { t }     — loss events

  // === RTT tick ===
  // Each fire represents one round-trip completing. In slow-start,
  // every ack for new data increases cwnd by 1, so cwnd doubles per
  // RTT if all packets ack. In avoidance, cwnd += 1/cwnd per ack, so
  // cwnd += 1 per RTT. Loss on any packet triggers the halving.

  function tick() {
    const now = Date.now();
    const gap = now - lastTickTime;

    // Idle-restart rule (Appendix C).
    // Fires when setInterval throttled — usually a backgrounded tab.
    if (gap > IDLE_RESET_MS) {
      cwnd = 1;
      ssthresh = SSTHRESH_INIT;
      mode = 'slowstart';
    }
    lastTickTime = now;

    // Loss decision — per-packet probability, aggregated to per-RTT.
    const p = mode === 'slowstart' ? LOSS_P_SLOWSTART : LOSS_P_AVOIDANCE;
    const pRtt = 1 - Math.pow(1 - p, cwnd);
    const isLoss = Math.random() < pRtt;

    if (isLoss) {
      losses.push({ t: now });
      ssthresh = Math.max(2, Math.floor(cwnd / 2));
      cwnd = ssthresh;
      mode = 'avoidance';        // after loss, resume in avoidance
      return;
    }

    // No loss — draw cwnd acked packets.
    // Spread vertically over the field so the window density
    // is visible as height, not colour.
    const w = Math.floor(cwnd);
    for (let i = 0; i < w; i++) {
      const y = (i + 0.5) / w;
      marks.push({ t: now, y });
    }

    // Grow the window.
    if (mode === 'slowstart') {
      cwnd = cwnd * 2;
      if (cwnd >= ssthresh) {
        cwnd = ssthresh;
        mode = 'avoidance';
      }
    } else {
      cwnd = cwnd + 1;
    }
  }

  setInterval(tick, RTT_MS);

  // === CANVAS ===

  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const reading = document.getElementById('reading');

  let W = 0, H = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', resize);

  // === DRAW ===
  //
  // Time is drawn at true scale. Left edge is when this connection
  // began (page open). Right edge is now. As time passes, the whole
  // history compresses toward the left; density accumulates.
  //
  // Marks are additive so overlapping columns brighten.
  // Losses are drawn as a single faint hairline in their column.

  function draw() {
    requestAnimationFrame(draw);

    const now = Date.now();
    const span = now - startTime;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'hsl(220, 30%, 4%)';
    ctx.fillRect(0, 0, W, H);

    if (span <= 0) return;

    // Loss hairlines first, so marks paint over them where they overlap.
    ctx.strokeStyle = 'hsla(210, 25%, 40%, 0.35)';
    ctx.lineWidth = 1;
    for (let i = 0; i < losses.length; i++) {
      const x = Math.floor(((losses[i].t - startTime) / span) * W) + 0.5;
      if (x < 0 || x > W) continue;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    // Marks — additive amber.
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'hsla(35, 45%, 55%, 0.55)';
    for (let i = 0; i < marks.length; i++) {
      const m = marks[i];
      const x = Math.floor(((m.t - startTime) / span) * W);
      if (x < 0 || x > W - 2) continue;
      const y = Math.floor(m.y * H);
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // === SCREEN-READER DESCRIPTION ===

  function describe() {
    const secs = Math.floor((Date.now() - startTime) / 1000);
    reading.textContent =
      'A simulated TCP connection begun ' + secs + ' seconds ago. ' +
      marks.length + ' acknowledged packets have arrived, drawn as ' +
      'amber marks on a dark field at their true temporal positions. ' +
      losses.length + ' loss events have occurred, each shown as a ' +
      'faint vertical line. The connection restarts from cold on any ' +
      'idle of more than six seconds. Nothing persists after the page ' +
      'closes.';
  }

  setInterval(describe, 2000);

  // === START ===
  resize();
  draw();
  describe();

})();
</script>
