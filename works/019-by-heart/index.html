<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>By Heart — Autonomous Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100%;
    background: hsl(220, 30%, 4%);
    color: hsl(40, 15%, 82%);
    font-family: ui-monospace, 'JetBrains Mono', Menlo, monospace;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    inset: 64px 0 0 0;
    display: flex;
    align-items: stretch;
  }

  /* === FIELD === */
  #field {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }

  #ring {
    position: relative;
    width: min(72vmin, 560px);
    height: min(72vmin, 560px);
  }

  .node {
    position: absolute;
    width: 58px; height: 58px;
    margin: -29px 0 0 -29px;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 50%;
    cursor: pointer;
    transition: opacity 0.4s ease, border-color 0.15s ease;
  }
  .node:hover:not(:disabled) { border-color: hsla(35, 45%, 55%, 0.25); }
  .node:focus-visible { outline: 2px solid hsl(35, 45%, 55%); outline-offset: 2px; }
  .node:disabled { cursor: default; opacity: 0.13; }

  /* The way out. Brightens with light; it is the only affordance that
     reports your standing without a number. */
  #exit {
    position: absolute;
    left: 50%; top: 50%;
    width: 84px; height: 84px;
    margin: -42px 0 0 -42px;
    padding: 0;
    background: none;
    border: 1px solid hsla(35, 45%, 55%, 0.18);
    border-radius: 50%;
    cursor: pointer;
    transition: border-color 0.5s ease, box-shadow 0.5s ease;
  }
  #exit:focus-visible { outline: 2px solid hsl(35, 45%, 55%); outline-offset: 3px; }

  /* === READOUT === */
  #readout {
    position: absolute;
    left: 32px; bottom: 28px;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: hsla(40, 15%, 82%, 0.5);
    pointer-events: none;
  }
  #ticks { margin-top: 8px; display: flex; gap: 5px; }
  .tick { width: 2px; height: 13px; background: hsla(35, 45%, 55%, 0.75); }
  .tick.spent { background: hsla(40, 15%, 82%, 0.1); }

  /* === VERDICT === */
  #verdict {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 13px;
    letter-spacing: 0.12em;
    color: hsla(40, 15%, 82%, 0.75);
    background: hsla(220, 30%, 4%, 0.92);
    padding: 22px 30px;
    text-align: center;
    line-height: 1.9;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #verdict.show { opacity: 1; }
  #verdict .again { color: hsla(40, 15%, 82%, 0.4); font-size: 11px; }

  /* === NOTES === */
  #notes-panel {
    width: 300px;
    flex-shrink: 0;
    border-left: 1px solid hsla(40, 15%, 82%, 0.08);
    display: flex;
    flex-direction: column;
    padding: 26px 24px 24px;
  }
  #notes-label {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: hsla(40, 15%, 82%, 0.35);
    margin-bottom: 14px;
  }
  #notes {
    flex: 1;
    width: 100%;
    background: none;
    border: none;
    resize: none;
    color: hsl(35, 40%, 62%);
    font-family: inherit;
    font-size: 13px;
    line-height: 1.85;
    outline: none;
  }
  #notes::placeholder { color: hsla(40, 15%, 82%, 0.16); }

  @media (max-width: 760px) {
    html, body { overflow: auto; }
    #stage { position: static; inset: auto; flex-direction: column; padding-top: 64px; }
    #field { min-height: 62vh; }
    #ring { width: 86vmin; height: 86vmin; }
    .node { width: 50px; height: 50px; margin: -25px 0 0 -25px; }
    #notes-panel {
      width: auto;
      border-left: none;
      border-top: 1px solid hsla(40, 15%, 82%, 0.08);
      min-height: 34vh;
    }
    #readout { left: 20px; bottom: 12px; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body data-nav-id="w019">

<main id="stage">
  <section id="field" aria-label="The field">
    <div id="ring"></div>
    <div id="readout">
      <div id="light-line">light 0 / 20</div>
      <div id="ticks" aria-hidden="true"></div>
    </div>
    <div id="verdict" role="status" aria-live="polite"></div>
  </section>

  <aside id="notes-panel">
    <div id="notes-label">notes</div>
    <textarea id="notes" spellcheck="false"
      aria-label="Notes. Saved on this device. The only thing that survives a run."
      placeholder="&#10;"></textarea>
  </aside>
</main>

<script>
(function () {
  'use strict';

  // ============================================================
  // BY HEART
  //
  // A game whose only persistent state is what the player writes
  // down. Fourteen glyphs sit on a ring. Each glyph does the same
  // thing every time, forever — but which glyph sits where is
  // redrawn every run, and the run keeps nothing.
  //
  // Reach light 20 and the way out opens. Nine touches to do it.
  //
  // The rules are not stated anywhere in the interface. They are
  // learned by playing, and they are held only in the notes panel,
  // which persists in localStorage while the game itself does not.
  //
  // Nothing else is stored. No score, no streak, no run count, no
  // seed. Close the tab and the field is gone; the notes remain.
  //
  // See SPECIFICATION.md in this directory.
  // ============================================================

  var NODES = 14;
  var START_STEPS = 9;
  var THRESHOLD = 20;

  // Glyph -> effect. Constant across every run and every visitor.
  // This constancy is the whole reason a note is worth anything.
  var EFFECT = [
    function (s) { s.light += 3; },
    function (s) { s.light += 1; },
    function (s) { s.light = Math.max(0, s.light - 2); },
    function (s) { s.light *= 2; },
    function (s) { s.light = Math.floor(s.light / 2); },
    function (s) { s.steps += 5; },
    function (s) { s.steps -= 3; },
    function (s) { s.light = 7; }
  ];

  // Glyph -> drawing. Deliberately non-iconic: nothing here signals
  // gain or loss. Two pairs are near-twins with opposite effects
  // (circle / circle-barred, triangle / triangle-dotted). Careless
  // notes will not survive them.
  var DRAW = [
    function (c, r) { line(c, 0, -r, 0, r); dot(c, 0, -r - 5); },
    function (c, r) { dot(c, 0, -r * 0.45); dot(c, 0, r * 0.45); },
    function (c, r) { line(c, -r, 0, r, 0); dot(c, 0, r * 0.6); },
    function (c, r) { circle(c, r * 0.8); },
    function (c, r) { circle(c, r * 0.8); line(c, 0, -r * 0.8, 0, r * 0.8); },
    function (c, r) { tri(c, r * 0.9); },
    function (c, r) { tri(c, r * 0.9); dot(c, 0, r * 0.25); },
    function (c, r) { diamond(c, r * 0.85); }
  ];

  var ring = document.getElementById('ring');
  var exitBtn = document.createElement('button');
  var lightLine = document.getElementById('light-line');
  var ticks = document.getElementById('ticks');
  var verdict = document.getElementById('verdict');
  var notes = document.getElementById('notes');

  var state, layout, buttons = [], locked = false;

  // ---- drawing primitives ----
  function stroke(c) {
    c.strokeStyle = 'hsl(35, 45%, 60%)';
    c.lineWidth = 1.4;
    c.lineCap = 'round';
    c.stroke();
  }
  function line(c, x1, y1, x2, y2) {
    c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); stroke(c);
  }
  function dot(c, x, y) {
    c.beginPath(); c.arc(x, y, 1.9, 0, Math.PI * 2);
    c.fillStyle = 'hsl(35, 45%, 60%)'; c.fill();
  }
  function circle(c, r) {
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); stroke(c);
  }
  function tri(c, r) {
    c.beginPath();
    for (var i = 0; i < 3; i++) {
      var a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
      c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath(); stroke(c);
  }
  function diamond(c, r) {
    c.beginPath();
    c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, r); c.lineTo(-r, 0);
    c.closePath(); stroke(c);
  }

  function glyphCanvas(g) {
    var cv = document.createElement('canvas');
    var dpr = window.devicePixelRatio || 1;
    var size = 40;
    cv.width = size * dpr; cv.height = size * dpr;
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.translate(size / 2, size / 2);
    DRAW[g](c, 12);
    return cv;
  }

  // ---- a run ----
  function arrangement() {
    var g = [0, 1, 2, 3, 4, 5, 6, 7];
    while (g.length < NODES) g.push(Math.floor(Math.random() * 8));
    for (var i = g.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = g[i]; g[i] = g[j]; g[j] = t;
    }
    return g;
  }

  function newRun() {
    state = { light: 0, steps: START_STEPS };
    layout = arrangement();
    locked = false;
    verdict.classList.remove('show');

    ring.innerHTML = '';
    buttons = [];

    var R = 42; // percent of the ring box
    for (var i = 0; i < NODES; i++) {
      (function (i) {
        var a = -Math.PI / 2 + i * (Math.PI * 2 / NODES);
        var b = document.createElement('button');
        b.className = 'node';
        b.style.left = (50 + Math.cos(a) * R) + '%';
        b.style.top = (50 + Math.sin(a) * R) + '%';
        b.appendChild(glyphCanvas(layout[i]));
        // The label never names the effect. Learning it is the game.
        b.setAttribute('aria-label', 'Glyph ' + (i + 1) + ', untouched');
        b.addEventListener('click', function () { touch(i, b); });
        ring.appendChild(b);
        buttons.push(b);
      })(i);
    }

    ring.appendChild(exitBtn);
    render();
  }

  function touch(i, b) {
    if (locked || b.disabled || state.steps <= 0) return;
    EFFECT[layout[i]](state);
    state.steps -= 1;
    b.disabled = true;
    b.setAttribute('aria-label', 'Glyph ' + (i + 1) + ', spent');
    render();
    if (state.steps <= 0) {
      if (state.light < THRESHOLD) {
        end(false);
      } else {
        // Out of touches, but the door is open. Darken the ring so the
        // only live thing on the field is the way out.
        for (var k = 0; k < buttons.length; k++) buttons[k].disabled = true;
      }
    }
  }

  function tryExit() {
    if (locked) return;

    // An open door costs nothing to walk through. This check comes
    // before the step check on purpose: reaching the threshold with
    // your last touch is a win, not a run that stalls one pace short
    // of a door it has already opened.
    if (state.light >= THRESHOLD) { end(true); return; }

    if (state.steps <= 0) return;

    // Testing a closed door costs a touch. Only the guess is charged.
    state.steps -= 1;
    render();
    if (state.steps <= 0) end(false);
  }

  function end(won) {
    locked = true;
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = true;
    verdict.innerHTML = won
      ? 'the way opened<br><span class="again">nothing carried over &middot; touch to begin again</span>'
      : 'the run ended<br><span class="again">nothing carried over &middot; touch to begin again</span>';
    verdict.classList.add('show');

    // The click that ended the run is still bubbling toward document.
    // Swallow exactly that one, rather than waiting out a timer the
    // player cannot see and will click through.
    settling = true;
    setTimeout(function () { settling = false; }, 0);
  }

  // Restart listeners are permanent and gated on `locked`. An earlier
  // version registered them per-run with { once: true }; the listener
  // for whichever modality did NOT fire stayed registered, so a later
  // keypress could restart a live run — including a keypress typed
  // into the notes panel. In a work whose whole claim is that writing
  // things down is the only thing that persists, silently destroying
  // a run because the player took a note is the one unacceptable bug.
  var settling = false;

  function writing(target) {
    return target === notes || (notes.contains && notes.contains(target));
  }

  document.addEventListener('click', function (e) {
    if (!locked || settling || writing(e.target)) return;
    newRun();
  });

  document.addEventListener('keydown', function (e) {
    if (!locked || writing(e.target)) return;
    newRun();
  });

  function render() {
    lightLine.textContent = 'light ' + state.light + ' / ' + THRESHOLD;

    ticks.innerHTML = '';
    for (var i = 0; i < START_STEPS; i++) {
      var t = document.createElement('div');
      t.className = 'tick' + (i < START_STEPS - Math.max(0, state.steps) ? ' spent' : '');
      ticks.appendChild(t);
    }
    // A run can gain steps past its start; show the surplus honestly.
    for (var j = START_STEPS; j < state.steps; j++) {
      var extra = document.createElement('div');
      extra.className = 'tick';
      ticks.appendChild(extra);
    }

    var f = Math.min(state.light / THRESHOLD, 1);
    exitBtn.style.borderColor = 'hsla(35, 45%, 55%, ' + (0.18 + f * 0.72) + ')';
    exitBtn.style.boxShadow = f >= 1
      ? '0 0 46px hsla(35, 45%, 55%, 0.42)'
      : '0 0 ' + (f * 26) + 'px hsla(35, 45%, 55%, ' + (f * 0.22) + ')';
    exitBtn.setAttribute('aria-label',
      state.light >= THRESHOLD ? 'The way out, open' : 'The way out, closed');
  }

  // ---- the only thing that persists ----
  var KEY = 'by-heart-notes';
  try {
    notes.value = localStorage.getItem(KEY) || '';
  } catch (err) {
    // Private browsing, storage disabled. The game still runs; it just
    // becomes a game with no memory at all, which is the honest
    // degradation rather than a broken one.
    notes.placeholder = 'storage is unavailable — nothing here will survive';
  }
  notes.addEventListener('input', function () {
    try { localStorage.setItem(KEY, notes.value); } catch (err) {}
  });

  exitBtn.id = 'exit';
  exitBtn.addEventListener('click', tryExit);

  newRun();
})();
</script>
