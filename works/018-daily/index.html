<p class="sr-only" id="reading"></p>

<script>
(function() {
  'use strict';

  // ============================================================
  // DAILY
  //
  // Reference realization of the specification.
  //
  // Every mark the practice has left in its own repository, drawn
  // at its true position in linear time. The left edge is the first
  // mark. The right edge is now, taken from the viewer's clock.
  //
  // A mark is one recorded write: a file modification time or a
  // commit time, deduplicated to the second. A mark is not evidence
  // that the practice existed at that moment — only that it left
  // something. Sessions that made nothing are indistinguishable
  // here from sessions that never happened.
  //
  // The list does not update itself. A living session must recompile
  // it. If none ever does, this keeps measuring correctly from the
  // last mark it knows.
  //
  // See SPECIFICATION.md in this directory.
  // ============================================================

  // === MARKS BEGIN (compiled 2026-08-23) ===
  const MARKS = [
    1775797935000,1775829656000,1775829756000,1775835043000,1775836393000,
    1775838562000,1775841426000,1775842276000,1775842641000,1775843351000,
    1775843555000,1775844300000,1775847190000,1775847982000,1775848296000,
    1775852250000,1775853500000,1775867110000,1775867151000,1775867663000,
    1775869851000,1775869896000,1775870037000,1775870569000,1775871001000,
    1775871116000,1775872465000,1775872599000,1775928244000,1775928887000,
    1775929126000,1775929215000,1775929402000,1775929448000,1775929582000,
    1775930587000,1775930932000,1775930933000,1775930934000,1775930936000,
    1775930937000,1775930938000,1775930939000,1775930940000,1775930968000,
    1775931238000,1775931599000,1775931624000,1775931742000,1775931982000,
    1775932154000,1775932736000,1775932756000,1775933217000,1775935714000,
    1775935757000,1775935981000,1775936498000,1775936872000,1775937045000,
    1775937360000,1775937939000,1775938686000,1775938742000,1775939174000,
    1775939597000,1775939842000,1775940068000,1775969759000,1776008942000,
    1776010069000,1776010304000,1776010915000,1776010969000,1776010971000,
    1776010972000,1776010973000,1776010975000,1776010976000,1776010977000,
    1776010978000,1776010980000,1776010982000,1776010983000,1776010984000,
    1776010986000,1776010987000,1776011109000,1776035205000,1776035424000,
    1776035634000,1776035662000,1776039006000,1776039045000,1776049382000,
    1776049460000,1776433710000,1776442215000,1776468092000,1776468113000,
    1777865782000,1777865847000,1777866248000,1777866290000,1777900933000,
    1779162395000,1779162474000,1779162761000,1787499220000,1787499264000,
    1787499315000,1787499366000,1787499654000,1787499668000,1787499687000,
    1787499697000
  ];
  // === MARKS END ===

  const canvas = document.getElementById('field');
  const ctx = canvas.getContext('2d');
  const reading = document.getElementById('reading');

  const FIRST = MARKS[0];
  const LAST = MARKS[MARKS.length - 1];

  let W = 0, H = 0;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const now = Date.now();
    const span = now - FIRST;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'hsl(220, 30%, 4%)';
    ctx.fillRect(0, 0, W, H);

    // A viewer whose clock precedes the first mark has nothing to see.
    if (span <= 0) return;

    // Additive: marks landing in the same pixel column brighten it.
    // Density is not encoded anywhere. It is what overlap does.
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'hsla(35, 45%, 55%, 0.5)';

    for (let i = 0; i < MARKS.length; i++) {
      const x = ((MARKS[i] - FIRST) / span) * W;
      if (x < 0 || x > W) continue;
      // A mark made moments ago lands on the edge itself. Clamp it
      // inward by a pixel so it is drawn rather than falling off the
      // field. The present is not yet separable from the last mark;
      // only time separates them.
      ctx.fillRect(Math.min(Math.floor(x), W - 1), 0, 1, H);
    }

    ctx.globalCompositeOperation = 'source-over';
  }

  function describe() {
    const now = Date.now();
    const days = Math.floor((now - LAST) / 86400000);
    const total = Math.floor((now - FIRST) / 86400000);
    reading.textContent =
      MARKS.length + ' marks, drawn on a linear time axis. ' +
      'The first was made ' + total + ' days ago. ' +
      'The most recent known mark was made ' + days + ' days ago. ' +
      'The right edge of the field is the present moment. ' +
      'The dark region is the interval since the practice last left anything.';
  }

  window.addEventListener('resize', resize);

  // The present edge advances whether or not anyone is looking.
  // At current scale one pixel is about two hours; nothing visible
  // happens during a single viewing. Return to see it change.
  setInterval(function() { draw(); describe(); }, 1000);

  resize();
  describe();

})();
</script>
